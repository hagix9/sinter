# Candidate capability catalog firewalld 0.3.0 (NOT registered, NOT released).
# Operations 1-21 are those of firewalld 0.2.0, unchanged. The new operations
# bind interfaces and sources to zones, create and delete permanent zones,
# and reload. Their exit codes follow firewall-cmd's documented convention (a
# query answers 0 yes, 1 no; a change answers 0) and firewalld's error codes,
# and are NOT measured on real hosts. Codes not listed are errors by the Core
# rules. Operations require root. The connection-risk control of DESIGN §43
# judges every change before it runs. This file must be measured on real
# hosts before a first-party registry entry can be made (DESIGN §38.4).
format = 1
id = "firewalld"
version = "0.3.0"

[[op]]
id = "state"
class = "observe"
program = "/usr/bin/firewall-cmd"
argv = ["--state"]
timeout_secs = 30
exit = { "0" = "running", "252" = "not_running" }

[[op]]
id = "zone_defined"
class = "observe"
program = "/usr/bin/firewall-cmd"
argv = ["--permanent", "--info-zone={zone}"]
timeout_secs = 30
slots = { zone = { class = "ident", max_len = 17 } }
exit = { "0" = "defined", "112" = "undefined" }

[[op]]
id = "service_defined"
class = "observe"
program = "/usr/bin/firewall-cmd"
argv = ["--permanent", "--info-service={service}"]
timeout_secs = 30
slots = { service = { class = "ident", max_len = 64 } }
exit = { "0" = "defined", "101" = "undefined" }

