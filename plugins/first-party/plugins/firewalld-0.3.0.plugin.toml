format = 1
id = "firewalld"
version = "0.3.0"
catalog = { id = "firewalld", version = "0.3.0" }

# A service in a zone, present or absent, runtime and permanent. Removing the
# ssh service is refused: it could cut the connection Sinter itself uses.
[[type]]
name = "firewalld.service"
fields = { zone = { kind = "ident" }, service = { kind = "ident" }, state = { kind = "enum", values = ["present", "absent"] } }
precheck = [
  { op = "state", expect = "running" },
  { op = "zone_defined", expect = "defined" },
  { op = "service_defined", expect = "defined" },
]
deny = [{ service = "ssh", state = "absent" }]

[[type.facet]]
name = "runtime"
observe = "query_service_runtime"
want = "field:state"
ensure = { present = "add_service_runtime", absent = "remove_service_runtime" }

[[type.facet]]
name = "permanent"
observe = "query_service_permanent"
want = "field:state"
ensure = { present = "add_service_permanent", absent = "remove_service_permanent" }

# One port with its protocol (`80/tcp`) in a zone, present or absent.
# Removing 22/tcp is refused (the SSH port). Ranges are firewalld.port_range.
[[type]]
name = "firewalld.port"
fields = { zone = { kind = "ident" }, port = { kind = "port_single" }, state = { kind = "enum", values = ["present", "absent"] } }
precheck = [
  { op = "state", expect = "running" },
  { op = "zone_defined", expect = "defined" },
]
deny = [{ port = "22/tcp", state = "absent" }]

[[type.facet]]
name = "runtime"
observe = "query_port_runtime"
want = "field:state"
ensure = { present = "add_port_runtime", absent = "remove_port_runtime" }

[[type.facet]]
name = "permanent"
observe = "query_port_permanent"
want = "field:state"
ensure = { present = "add_port_permanent", absent = "remove_port_permanent" }

# A port range with its protocol (`8000-8099/udp`) in a zone, present only.
# There is no absent: firewalld answers a query for a range that is only
# partly allowed with "no", so "absent" could not mean "no port of the range
# is allowed". Close the ports of a range with firewalld.port, one by one.
[[type]]
name = "firewalld.port_range"
fields = { zone = { kind = "ident" }, port = { kind = "port_spec" }, state = { kind = "enum", values = ["present"] } }
precheck = [
  { op = "state", expect = "running" },
  { op = "zone_defined", expect = "defined" },
]

[[type.facet]]
name = "runtime"
observe = "query_port_runtime"
want = "field:state"
ensure = { present = "add_port_runtime" }

[[type.facet]]
name = "permanent"
observe = "query_port_permanent"
want = "field:state"
ensure = { present = "add_port_permanent" }

# An IP protocol (`gre`, `icmp`, `ipv6-icmp`, ...) allowed in a zone, present
# or absent.
[[type]]
name = "firewalld.protocol"
fields = { zone = { kind = "ident" }, protocol = { kind = "ident" }, state = { kind = "enum", values = ["present", "absent"] } }
precheck = [
  { op = "state", expect = "running" },
  { op = "zone_defined", expect = "defined" },
]

[[type.facet]]
name = "runtime"
observe = "query_protocol_runtime"
want = "field:state"
ensure = { present = "add_protocol_runtime", absent = "remove_protocol_runtime" }

[[type.facet]]
name = "permanent"
observe = "query_protocol_permanent"
want = "field:state"
ensure = { present = "add_protocol_permanent", absent = "remove_protocol_permanent" }

# An interface bound to a zone, present or absent, runtime and permanent.
# present moves the interface into the zone (firewalld --change-interface).
# For an interface managed by NetworkManager the permanent zone may be held
# by NetworkManager (connection.zone); see DESIGN §44.3.
[[type]]
name = "firewalld.interface"
fields = { zone = { kind = "ident" }, interface = { kind = "ifname" }, state = { kind = "enum", values = ["present", "absent"] } }
precheck = [
  { op = "state", expect = "running" },
  { op = "zone_defined", expect = "defined" },
]

[[type.facet]]
name = "runtime"
observe = "query_interface_runtime"
want = "field:state"
ensure = { present = "change_interface_runtime", absent = "remove_interface_runtime" }

[[type.facet]]
name = "permanent"
observe = "query_interface_permanent"
want = "field:state"
ensure = { present = "change_interface_permanent", absent = "remove_interface_permanent" }

# A source network bound to a zone, present or absent, runtime and permanent.
[[type]]
name = "firewalld.source"
fields = { zone = { kind = "ident" }, source = { kind = "cidr" }, state = { kind = "enum", values = ["present", "absent"] } }
precheck = [
  { op = "state", expect = "running" },
  { op = "zone_defined", expect = "defined" },
]

[[type.facet]]
name = "runtime"
observe = "query_source_runtime"
want = "field:state"
ensure = { present = "add_source_runtime", absent = "remove_source_runtime" }

[[type.facet]]
name = "permanent"
observe = "query_source_permanent"
want = "field:state"
ensure = { present = "add_source_permanent", absent = "remove_source_permanent" }

# A permanent zone, present or absent. A new zone exists at runtime only
# after a reload. Deleting a predefined zone is refused.
[[type]]
name = "firewalld.zone"
fields = { zone = { kind = "ident" }, state = { kind = "enum", values = ["present", "absent"] } }
precheck = [{ op = "state", expect = "running" }]
deny = [
  { zone = "block", state = "absent" },
  { zone = "dmz", state = "absent" },
  { zone = "drop", state = "absent" },
  { zone = "external", state = "absent" },
  { zone = "home", state = "absent" },
  { zone = "internal", state = "absent" },
  { zone = "public", state = "absent" },
  { zone = "trusted", state = "absent" },
  { zone = "work", state = "absent" },
]

[[type.facet]]
name = "permanent"
observe = "query_zone_permanent"
want = "field:state"
ensure = { present = "new_zone_permanent", absent = "delete_zone_permanent" }
