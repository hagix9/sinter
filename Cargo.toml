[package]
name = "sinter"
version = "1.3.0"
edition = "2021"
description = "Sinter: a lightweight, agentless configuration-management tool"
license = "MIT OR Apache-2.0"

[[bin]]
name = "sinter"
path = "src/main.rs"

[lib]
name = "sinter"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
saphyr-parser = "0.0.12"
ssh2 = "0.9"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
# Encrypted-secret core (src/secrets.rs). Standard age format only; no default
# features (no plugins, SSH keys, async, CLI helpers). Exact pin: the version is
# reviewed (SINTER_SECRETS_PHASE_A_2026-10-04.md) and moves only by a deliberate
# change.
age = { version = "=0.12.1", default-features = false, features = ["armor"] }
zeroize = "1"

[dev-dependencies]
libc = "0.2"

[profile.release]
opt-level = 2

# The passphrase KDF is memory-hard by design; unoptimized it makes the secret
# tests take minutes. Optimize only the crates that do that work (dev/test
# builds only; release is unchanged).
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
