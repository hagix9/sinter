# Apache httpd with HTTP Basic authentication from an htpasswd file, on Rocky
# Linux / RHEL 8, 9 and 10.
#
# Package-created accounts: httpd's scriptlet creates the apache user/group,
# which do not exist yet when plan runs. They are declared first with the
# package's own attributes (uid/gid 48, /usr/share/httpd, /sbin/nologin); the
# scriptlet then finds them and leaves them alone, plan defers what depends on
# them instead of failing, and audit checks them.
#
# Secrets: secrets/htpasswd.age holds the htpasswd file (bcrypt lines, e.g. made
# with `htpasswd -niB <user>`); it is written 0640 root:apache and never shown.
#
#   sinter apply examples/recipes/apache-htpasswd.yaml --host <host> --sudo
version: 1

resources:
  - id: apache_group
    type: group
    with: { name: apache, gid: 48, system: true }

  - id: apache_user
    type: user
    depends_on: [apache_group]
    with:
      name: apache
      uid: 48
      group: apache
      home: /usr/share/httpd
      shell: /sbin/nologin
      create_home: false
      system: true

  - id: httpd
    type: package
    depends_on: [apache_user]
    with: { name: httpd, state: present }

  - id: htpasswd
    type: file
    depends_on: [httpd]
    notify: [reload_httpd]
    with:
      path: /etc/httpd/htpasswd-site
      content: { secret: secrets/htpasswd.age }
      owner: root
      group: apache
      mode: "0640"

  # Checked by httpd itself before publication: the full configuration plus
  # the staged file (`-c` applies the Include after the main configuration).
  - id: site_auth
    type: file
    depends_on: [htpasswd]
    notify: [reload_httpd]
    with:
      path: /etc/httpd/conf.d/site-auth.conf
      source: apache/site-auth.conf
      owner: root
      group: root
      mode: "0644"
      validate:
        program: /usr/sbin/httpd
        args: ["-t", "-c", "Include {{ staged }}"]

  - id: private_dir
    type: directory
    depends_on: [httpd]
    with: { path: /var/www/html/private, owner: root, group: apache, mode: "0750" }

  - id: private_index
    type: file
    depends_on: [private_dir]
    with:
      path: /var/www/html/private/index.html
      source: apache/private-index.html
      owner: root
      group: apache
      mode: "0640"

  - id: httpd_service
    type: service
    depends_on: [site_auth, private_index]
    with: { name: httpd, state: running, enabled: true }

handlers:
  - id: reload_httpd
    service: httpd
    action: reload
