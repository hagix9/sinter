# Python on Rocky Linux / RHEL 8 (an SSH target; run Sinter from a supported
# controller such as EL9/EL10 or Ubuntu).
#
# Declare packages by their real names. On EL8 `python3` and `python311` are
# not package names: dnf only reaches them through a provides match
# (python3 -> python36, python311 -> python3.11), and Sinter refuses such a
# name before installing anything, naming the real package.
#
#   sinter apply examples/recipes/python-el8.yaml --host <el8-host> --sudo
version: 1

resources:
  # Python 3.6 (AppStream module stream python36:3.6, enabled automatically).
  - id: python36
    type: package
    when: "facts.os.family == 'redhat' && facts.os.version_major == 8"
    with: { name: python36, state: present }

  # Python 3.11 and 3.12 are ordinary (non-modular) packages on EL8.
  - id: python311
    type: package
    when: "facts.os.family == 'redhat' && facts.os.version_major == 8"
    with: { name: python3.11, state: present }

  - id: python311_pip
    type: package
    when: "facts.os.family == 'redhat' && facts.os.version_major == 8"
    with: { name: python3.11-pip, state: present }

  - id: python312
    type: package
    when: "facts.os.family == 'redhat' && facts.os.version_major == 8"
    with: { name: python3.12, state: present }
