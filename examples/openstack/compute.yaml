# Sinter × hagistack (rocky10.2): the COMPUTE role — a compute-only node (hagistack's `compute-add`).
# Needs secrets/compute.yaml (the five credentials delivered by `compute-secrets`) and the controller's address in
# site.yaml. The node opens no database and holds no admin credential. NOT part of the all-in-one acceptance.
version: 1

targets:
  groups: [compute]

vars:
  has_hypervisor: { value: "true" }
  nova_db_prefix: { value: "# " }          # a compute-only node must not open the cell database

include:
  - site.yaml
  - secrets/compute.yaml
  - components/compute-preflight.yaml
  - components/preflight.yaml
  - components/host-base.yaml
  - components/repo-local.yaml
  - components/repos.yaml
  - components/selinux.yaml
  - components/ovs.yaml
  - components/ovn-chassis.yaml
  - components/ovn-metadata.yaml
  - components/nova-compute.yaml

resources:
  - id: svc_ovn_controller
    type: service
    depends_on: [pkg_ovn_host, ovs_remote, ovs_encap_type, ovs_encap_ip, ovs_system_id, ovs_hostname]
    with: { name: ovn-controller, state: running, enabled: true }
  - id: svc_neutron_ovn_metadata_agent
    type: service
    depends_on: [pkg_ovn_metadata_agent, ovn_metadata_ini, ovs_manager, svc_ovn_controller]
    with: { name: neutron-ovn-metadata-agent, state: running, enabled: true }
  - id: svc_nova_compute
    type: service
    depends_on: [pkg_nova_compute, nova_conf, nova_tmp_dir, svc_libvirtd, ovs_manager, svc_ovn_controller, compute_reach_controller]
    with: { name: openstack-nova-compute, state: running, enabled: true }
  # nova.conf differs by role only in {{ vars.nova_db_prefix }}; the template is shared.
  - id: nova_conf
    type: template
    sensitive: true
    notify: [restart_nova_compute]
    depends_on: [pkg_nova_compute, etc_dir]
    with:
      path: /etc/nova/nova.conf
      source: templates/nova.conf.tpl
      owner: root
      group: nova
      mode: "0640"
