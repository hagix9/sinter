# Common: serve the RPM repository directory over HTTP on the loopback address, because Sinter's `package` resource
# cannot install from a file:// repository (found on the real run: dnf --downloadonly uses a local repository in
# place and puts no payload into the snapshot, so Sinter reports "expected payload missing from snapshot").
# The repository itself (the directory with repodata/ and the RPMs, see tools/stage-rpm-repo.sh and README.md) is put
# in {{ vars.repo_dir }} before the first apply; repo_url (site.yaml) points here by default. If repo_url names a
# repository somewhere else, this server just serves an empty directory.
version: 1

resources:
  - id: repo_dir
    type: directory
    with: { path: "{{ vars.repo_dir }}", owner: root, group: root, mode: "0755" }
  - id: repo_server_unit
    type: file
    with:
      path: /etc/systemd/system/sinter-openstack-repo.service
      owner: root
      group: root
      mode: "0644"
      content: |
        [Unit]
        Description=Local OpenStack RPM repository (loopback only)
        After=network.target

        [Service]
        ExecStart=/usr/bin/python3 -m http.server {{ vars.repo_port }} --bind 127.0.0.1 --directory {{ vars.repo_dir }}
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target
  - id: svc_repo_local
    type: service
    depends_on: [repo_dir, repo_server_unit]
    with: { name: sinter-openstack-repo.service, state: running, enabled: true }
