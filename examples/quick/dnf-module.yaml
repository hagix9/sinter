# A package that lives in a DNF module stream (DNF 4: Rocky Linux, RHEL and
# AlmaLinux 9; EL 10 ships no module streams, so this fails there at apply).
#
# Sinter's `package` resource installs whatever the enabled repositories and
# module state resolve. When a package is only reachable through a *non-default*
# module stream, declare the stream with a `dnf_module` resource and list it in
# the package's `depends_on`, so the install runs after the stream is enabled.
# (A package on the module's default stream needs no `dnf_module`.)
#
# `dnf_module` reads DNF's own module state (/etc/dnf/modules.d/nodejs.module):
# when the stream is already enabled, plan and apply report no change and dnf
# is not run. Whether `nodejs:20` exists in the enabled repositories is checked
# by dnf at apply; plan does not read repository metadata.
#
# A module that is already enabled with ANOTHER stream is not switched: plan
# fails and asks for an explicit reset first (state: reset, in an earlier run).
version: 1

resources:
  - id: enable-nodejs-stream
    type: dnf_module
    with:
      name: nodejs
      stream: "20"
      state: enabled

  - id: install-nodejs
    type: package
    depends_on: [enable-nodejs-stream]
    with:
      name: nodejs
      state: present
