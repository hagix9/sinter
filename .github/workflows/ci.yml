name: CI

# Per-commit checks that do not change the host: formatting, clippy, building
# the root test binaries without running them, the gateway tests, the
# installer and release-checker tests, the public-tree guard, and schema
# validation of the examples and the docs' recipes. The root test suite changes the host it
# runs on (apt, systemd units, the host's SSH service) and runs only in the
# release gate (RELEASE.md step 4) on a dedicated, disposable Linux host.
# Failures are fixed forward; nothing is retried automatically.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: 1.98.1

jobs:
  checks:
    name: fmt, clippy, root test build, gateway tests, installer and release tests, examples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require a GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT_CONTEXT: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENVIRONMENT_CONTEXT" != github-hosted ] || [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]; then
            echo "::error::this job runs only on GitHub-hosted runners (runner.environment=$RUNNER_ENVIRONMENT_CONTEXT, RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset})"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          # the OpenStack tutorial check compares the commit the tutorial pins with this one
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Record the environment
        run: |
          cat /etc/os-release; uname -m; rustc --version; cargo --version

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # Compile and link every root test binary without running it.
      - run: cargo test --locked --all-targets --all-features --no-run
      - run: python3 tests/installer/test_install.py
      - run: python3 -m unittest discover -s release/tests
      - run: cargo fmt --manifest-path gateway/Cargo.toml --check
      - run: cargo clippy --manifest-path gateway/Cargo.toml --locked --all-targets --all-features -- -D warnings
      # gateway/tests/assembly.rs runs the bridge against ../target/debug/sinter.
      # In the release gate the root tests build it first; here it is built
      # explicitly.
      - name: Build the sinter binary for the gateway tests
        run: cargo build --locked --all-features
      # The public tree: no local work product is committable and no tracked
      # file matches an ignore rule.
      - run: .github/scripts/check-public-tree.sh
      # Every example recipe and every complete recipe in the docs validates
      # against the schema (no target, no network, placeholder secrets). The
      # self-test first proves that an invalid recipe makes the check fail.
      - run: .github/scripts/validate-examples.sh target/debug/sinter --self-test
      - run: .github/scripts/validate-examples.sh target/debug/sinter
      # The OpenStack example's tools/gen-secrets.sh. Unlike the root suite this test changes
      # nothing on the host (a temporary directory and a stand-in openssl), so it runs here;
      # /bin/sh is dash on this runner.
      - run: cargo test --locked --all-features --test openstack_gen_secrets
      # The OpenStack tutorial's shell commands: bash syntax, en/ja parity, and
      # every recipe file, option, object name, path and unit they use exists
      # (node built-ins only); the sample `sinter validate` counts are checked
      # against this build. The tests first prove each check rejects a mistake.
      - run: node --test docs-site/scripts/check-tutorial-commands.test.mjs
      # TUTORIAL_REQUIRE_PIN: the commit the tutorial checks out must be in the history (hence
      # fetch-depth 0) and carry the same examples/openstack as this commit.
      - run: SINTER_BIN="$PWD/target/debug/sinter" TUTORIAL_REQUIRE_PIN=1 node docs-site/scripts/check-tutorial-commands.mjs
      - run: cargo test --manifest-path gateway/Cargo.toml --locked --all-targets --all-features
