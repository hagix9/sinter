name: CI

# Runs the release gate's Linux build and test commands (RELEASE.md step 4)
# for the root crate and gateway/ on every push and pull request. It does not
# replace the release gate or target acceptance. Failures are fixed forward;
# nothing is retried automatically.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: 1.98.1

jobs:
  checks:
    name: fmt, clippy, gateway tests, installer and release tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require a GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT_CONTEXT: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENVIRONMENT_CONTEXT" != github-hosted ] || [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]; then
            echo "::error::this job runs only on GitHub-hosted runners (runner.environment=$RUNNER_ENVIRONMENT_CONTEXT, RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset})"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Record the environment
        run: |
          cat /etc/os-release; uname -m; rustc --version; cargo --version

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: python3 tests/installer/test_install.py
      - run: python3 -m unittest discover -s release/tests
      - run: cargo fmt --manifest-path gateway/Cargo.toml --check
      - run: cargo clippy --manifest-path gateway/Cargo.toml --locked --all-targets --all-features -- -D warnings
      # gateway/tests/assembly.rs runs the bridge against ../target/debug/sinter.
      # In the release gate the root tests build it first; here it is built
      # explicitly.
      - name: Build the sinter binary for the gateway tests
        run: cargo build --locked --all-features
      - run: cargo test --manifest-path gateway/Cargo.toml --locked --all-targets --all-features

  linux-tests:
    # The root test suite changes the host it runs on: apt installs and
    # removals, systemd fixture units, and the host's own SSH service
    # (install, enable, restart). It must only run on a GitHub-hosted runner,
    # which is a fresh virtual machine per job.
    name: root tests (host-mutating, GitHub-hosted only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require a GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT_CONTEXT: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENVIRONMENT_CONTEXT" != github-hosted ] || [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]; then
            echo "::error::this job runs only on GitHub-hosted runners (runner.environment=$RUNNER_ENVIRONMENT_CONTEXT, RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset})"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Record the environment
        run: |
          cat /etc/os-release; uname -m; rustc --version; cargo --version
          grep -l '^#!\[cfg(target_os = "linux")\]' tests/*.rs

      # Sinter requires getfattr (package attr) on a target; the runner image
      # does not ship it.
      - name: Install attr
        run: |
          sudo apt-get update
          sudo apt-get install -y attr

      - run: cargo test --locked --all-targets --all-features

  runner-trust-diagnostics:
    # TEMPORARY (WP-N runner trust diagnostic). Read-only inspection of
    # candidate passwd-home locations against Sinter's parent-path trust rule
    # (src/targetfs.rs check_trusted_parents). Prints owner, mode, ACL entry
    # tags and extended-attribute names only, never attribute values. It
    # changes nothing on the runner except installing attr/acl if missing.
    name: runner trust diagnostics (temporary, read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require a GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT_CONTEXT: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_ENVIRONMENT_CONTEXT" != github-hosted ] || [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]; then
            echo "::error::this job runs only on GitHub-hosted runners (runner.environment=$RUNNER_ENVIRONMENT_CONTEXT, RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset})"
            exit 1
          fi

      - name: Inspection tools
        run: |
          missing=()
          command -v getfattr >/dev/null || missing+=(attr)
          command -v getfacl >/dev/null || missing+=(acl)
          echo "missing before install: ${missing[*]:-none}"
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${missing[@]}"
          fi
          dpkg-query -W -f='${Package} ${Version}\n' attr acl

      - name: Inspect candidate paths (read-only)
        run: |
          # Diagnostic only: keep inspecting every path even when a single
          # inspection command fails (for example grep finding no names).
          set +e -u
          me="$(id -u)"
          # Sinter's unsafe_attr(): security.* except security.selinux,
          # trusted.*, system.posix_acl*, system.nfs4_acl*.
          unsafe() { grep -E '^(security\.|trusted\.|system\.posix_acl|system\.nfs4_acl)' | grep -vx 'security.selinux' || true; }
          names() { "$@" 2>/dev/null | grep -v '^#' | grep -v '^$' | sort | tr '\n' ' '; }
          inspect() {
            local d="$1" v=""
            if [ ! -e "$d" ] && ! sudo test -e "$d"; then echo "$d | absent"; return; fi
            local st; st="$(sudo stat -c 'uid=%u(%U) gid=%g(%G) mode=%a type=%F' -- "$d")"
            local fs; fs="$(findmnt -n -o FSTYPE -T "$d" 2>/dev/null || echo '?')"
            local acl; acl="$(sudo getfacl -p -c --skip-base -- "$d" 2>/dev/null \
              | sed -E 's/^(default:)?([a-z]+):[^:]+:/\1\2:<named>:/' | tr '\n' ' ')"
            local ux rx; ux="$(names getfattr -m - --absolute-names -- "$d")"
            rx="$(names sudo getfattr -m - --absolute-names -- "$d")"
            local uid mode; uid="$(sudo stat -c %u -- "$d")"; mode="$(sudo stat -c %a -- "$d")"
            [ -L "$d" ] && v="$v symlink;"
            [ "$uid" = 0 ] || [ "$uid" = "$me" ] || v="$v owner-uid-$uid;"
            [ $(( 8#$mode & 8#022 )) -eq 0 ] || v="$v group/other-writable;"
            [ -z "$acl" ] || v="$v posix-acl;"
            local bad; bad="$(printf '%s\n' $rx | unsafe | tr '\n' ' ')"
            [ -z "$bad" ] || v="$v unsafe-xattr:[${bad% }];"
            echo "$d | fs=$fs $st | acl=[${acl% }] | xattr(user)=[${ux% }] | xattr(root)=[${rx% }] | ${v:- TRUST-COMPATIBLE}"
          }
          chain() {
            local p="$1" cur="" part
            inspect /
            IFS=/ read -ra parts <<< "${p#/}"
            for part in "${parts[@]}"; do
              [ -n "$part" ] || continue
              cur="$cur/$part"
              inspect "$cur"
            done
          }
          echo "== identity"
          getent passwd runner | cut -d: -f1,3,4,6,7
          id -nG runner
          sudo -n true && echo "passwordless sudo: yes"
          echo "RUNNER_TEMP=$RUNNER_TEMP CARGO_HOME=${CARGO_HOME:-unset} RUSTUP_HOME=${RUSTUP_HOME:-unset}"
          echo "useradd: $(command -v useradd || echo absent)"
          echo "== candidate chains (for uid $me, non-sudo view; trusted owners are uid 0 and uid $me)"
          for c in / /home /home/runner /srv /root /var/lib "$RUNNER_TEMP"; do
            echo "-- $c"
            chain "$c"
          done
          echo "== toolchain locations"
          for t in "${CARGO_HOME:-$HOME/.cargo}" "${RUSTUP_HOME:-$HOME/.rustup}"; do inspect "$t"; done
